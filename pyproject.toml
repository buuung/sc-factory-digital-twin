[project]
name = "openfab"
version = "0.1.0"
description = "작은 반도체 Fab 시뮬레이터와 실험 하네스, 그리고 하네스를 도구로 쓰는 AI Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
openfab-run = "openfab.harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
