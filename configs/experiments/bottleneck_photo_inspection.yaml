# 병목 실험: 포토·검사 장비 수 × 투입 간격 (B안, 2026-11-09)
#
# 질문: 병목(포토)에 장비를 추가하면 생산량이 얼마나 늘까? 병목은 어디로 옮겨갈까?
#
# 실행 전 예상 (손계산, 처리능력 Lot/h: 포토 2.86×대수, 식각 3.43, 증착 4.80, CMP 3.75, 검사 3.33×대수)
#   투입 15분(4 Lot/h, 넘치게):
#     포토1·검사1 → 2.86 포토 병목 / 포토2·검사1 → 3.33 검사 병목(+17%) / 포토3·검사1 → 3.33 (3대째 효과 거의 없음)
#     포토2·검사2 → 3.43 식각 병목 / 포토3·검사2 → 3.43 식각
#
# 실제 결과 (2026-11-21, Lot 200개·삼각분포, seed 1·2·3 평균):
#   투입 15분: 포토1·검사1 2.78 / 포토1·검사2 2.77(+0%) / 포토2·검사1 3.23(+16%, 검사) /
#              포토3·검사1 3.23(+0%) / 포토2·검사2 3.32(+19%, 식각)
#   투입 24분 2.44, 30분 1.97: 장비를 어떻게 바꿔도 그대로 (투입이 병목)
#   투입 30분(2 Lot/h, 모자라게): 장비를 늘려도 생산량은 2 근처 그대로 (투입이 병목)
#   투입 24분(2.5 Lot/h): 생산량 2.5 근처, 장비 추가 효과 없음

name: bottleneck_photo_inspection
base: configs/factory.yaml
seeds: [1, 2, 3]
vary:
  processes.photo.machines: [1, 2, 3]
  processes.inspection.machines: [1, 2]
  release.interval: [30, 24, 15]
